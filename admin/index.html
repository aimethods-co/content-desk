<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A0A0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Content Desk</title>
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #0A0A0A; --raised: #141414; --raised2: #1C1C1C; --hair: #262626; --edge: #333;
    --ink: #FFFFFF; --body: rgba(255,255,255,.8); --muted: rgba(255,255,255,.6); --faint: rgba(255,255,255,.42);
    --mint: #6FBF9B; --mint-wash: rgba(111,191,155,.13); --ledger: #1C5D42;
    --amber: #DCA45E; --amber-wash: rgba(220,164,94,.13); --danger: #F0857C; --danger-wash: rgba(240,133,124,.13);
    --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--night); color: var(--ink); font: 500 16px/1.5 Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body { overscroll-behavior-y: contain; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: var(--mint); text-decoration: none; }

  /* ---------- login ---------- */
  #login { min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px calc(24px + var(--safe-b)); }
  .lock { width: 100%; max-width: 360px; text-align: center; }
  .lock img { width: 72px; height: 72px; border-radius: 50%; }
  .lock h1 { font-size: 30px; font-weight: 900; letter-spacing: -1px; margin: 20px 0 6px; }
  .lock p { color: var(--muted); margin: 0 0 28px; }
  .input { width: 100%; padding: 15px 16px; border-radius: 14px; border: 0; background: var(--raised); box-shadow: inset 0 0 0 1px var(--edge); outline: none; font-size: 16px; }
  .input:focus { box-shadow: inset 0 0 0 1.5px var(--mint); }
  textarea.input { min-height: 120px; resize: vertical; line-height: 1.55; }
  .check { display: flex; gap: 10px; align-items: center; justify-content: center; color: var(--muted); margin: 16px 0 20px; font-size: 15px; }
  .check input { width: 18px; height: 18px; accent-color: var(--mint); }
  .err { color: var(--danger); min-height: 22px; margin-top: 14px; font-size: 14px; }

  /* ---------- buttons ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border: 0; border-radius: 14px;
         font-weight: 700; background: var(--raised2); box-shadow: inset 0 0 0 1px var(--edge); }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .5; }
  .btn.primary { background: #fff; color: var(--night); box-shadow: none; }
  .btn.mint { background: var(--mint-wash); color: var(--mint); box-shadow: inset 0 0 0 1px rgba(111,191,155,.3); }
  .btn.amber { background: var(--amber-wash); color: var(--amber); box-shadow: inset 0 0 0 1px rgba(220,164,94,.3); }
  .btn.danger { background: transparent; color: var(--danger); box-shadow: inset 0 0 0 1px rgba(240,133,124,.35); }
  .btn.block { width: 100%; }
  .icon { width: 20px; height: 20px; flex: none; }

  /* ---------- app shell ---------- */
  .top { position: sticky; top: 0; z-index: 5; padding: calc(10px + var(--safe-t)) 16px 0; background: rgba(10,10,10,.9); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .topbar { display: flex; align-items: center; gap: 12px; max-width: 1100px; margin: 0 auto; }
  .topbar h1 { margin: 0; font-size: 26px; font-weight: 900; letter-spacing: -.8px; flex: 1; }
  .round { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--raised2); display: grid; place-items: center; box-shadow: inset 0 0 0 1px var(--edge); }
  .round.spin svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .seg { display: flex; gap: 6px; max-width: 1100px; margin: 12px auto 0; padding-bottom: 12px; overflow-x: auto; scrollbar-width: none; }
  .seg button { flex: none; border: 0; min-height: 38px; padding: 0 14px; border-radius: 100px; background: var(--raised); color: var(--muted); font-weight: 700; font-size: 14px; box-shadow: inset 0 0 0 1px var(--hair); }
  .seg button.on { background: #fff; color: var(--night); box-shadow: none; }
  .seg .n { opacity: .6; margin-left: 4px; }
  main { max-width: 1100px; margin: 0 auto; padding: 4px 16px calc(110px + var(--safe-b)); }

  .day { font-size: 13px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); margin: 22px 0 10px; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  @media (min-width: 640px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (min-width: 960px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .card { position: relative; border-radius: 18px; overflow: hidden; background: var(--raised); box-shadow: inset 0 0 0 1px var(--hair); border: 0; padding: 0; text-align: left; display: block; width: 100%; }
  .thumb { position: relative; aspect-ratio: 4 / 5; background: #000 center / cover no-repeat; }
  .thumb.tall { aspect-ratio: 9 / 16; }
  .thumb .textpost { position: absolute; inset: 0; padding: 46px 14px 14px; font-size: 14px; color: var(--body); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 9; -webkit-box-orient: vertical; background: linear-gradient(180deg, #161616, #0f0f0f); }
  .badge { position: absolute; top: 10px; left: 10px; padding: 4px 9px; border-radius: 100px; font-size: 11px; font-weight: 800; letter-spacing: .04em; background: rgba(0,0,0,.65); backdrop-filter: blur(6px); }
  .badge.sched { color: var(--mint); } .badge.held { color: var(--amber); } .badge.fail { color: var(--danger); } .badge.done { color: #fff; } .badge.off { color: var(--faint); }
  .kind { position: absolute; top: 10px; right: 10px; padding: 4px 8px; border-radius: 100px; font-size: 11px; font-weight: 800; background: rgba(0,0,0,.65); color: #fff; }
  .info { padding: 10px 12px 12px; }
  .info b { display: block; font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .info span { display: block; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .empty { text-align: center; color: var(--faint); padding: 70px 20px; }
  .empty b { display: block; color: var(--body); font-size: 18px; margin-bottom: 6px; }

  /* ---------- bottom nav ---------- */
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; padding: 8px 10px calc(8px + var(--safe-b));
            background: rgba(10,10,10,.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--hair); }
  .tabbar div { display: grid; grid-template-columns: repeat(4, 1fr); max-width: 560px; margin: 0 auto; }
  .tabbar button { border: 0; background: none; color: var(--faint); display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; font-size: 12px; font-weight: 700; position: relative; }
  .tabbar button.on { color: #fff; }
  .tabbar button.on svg { color: var(--mint); }
  .tabbar .dot { position: absolute; top: 2px; left: calc(50% + 8px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--amber); color: #000; font-size: 11px; font-weight: 800; display: grid; place-items: center; }

  /* ---------- sheet ---------- */
  .scrim { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.6); opacity: 0; transition: opacity .25s; }
  .scrim.on { opacity: 1; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-height: 94dvh; overflow-y: auto; background: var(--raised); border-radius: 24px 24px 0 0;
           transform: translateY(100%); transition: transform .3s cubic-bezier(.2,.8,.2,1); padding-bottom: calc(20px + var(--safe-b)); overscroll-behavior: contain; }
  .sheet.on { transform: translateY(0); }
  @media (min-width: 900px) { .sheet { left: 50%; right: auto; bottom: 50%; width: 900px; transform: translate(-50%, 60%); opacity: 0; border-radius: 24px; max-height: 88dvh; transition: transform .3s, opacity .2s; }
    .sheet.on { transform: translate(-50%, 50%); opacity: 1; } .sheet .split { display: grid; grid-template-columns: 340px 1fr; gap: 20px; align-items: start; } }
  .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--edge); margin: 10px auto 4px; }
  .shead { display: flex; align-items: center; gap: 12px; padding: 8px 16px 12px; position: sticky; top: 0; background: var(--raised); z-index: 2; }
  .shead h2 { margin: 0; font-size: 18px; font-weight: 800; flex: 1; line-height: 1.25; }
  .shead small { display: block; color: var(--muted); font-weight: 600; font-size: 13px; }
  .sbody { padding: 0 16px; }
  .viewer { position: relative; border-radius: 16px; overflow: hidden; background: #000; }
  .slides { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .slides::-webkit-scrollbar { display: none; }
  .slides > * { flex: 0 0 100%; width: 100%; scroll-snap-align: center; display: block; max-height: 64dvh; object-fit: contain; background: #000; }
  .dots { display: flex; justify-content: center; gap: 6px; padding: 10px 0 0; }
  .dots i { width: 6px; height: 6px; border-radius: 3px; background: var(--edge); transition: width .2s, background .2s; }
  .dots i.on { width: 18px; background: var(--mint); }
  .loading { aspect-ratio: 4 / 5; display: grid; place-items: center; color: var(--faint); }
  .section { margin-top: 18px; }
  .label { font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); margin-bottom: 8px; display: block; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .actions .full { grid-column: 1 / -1; }
  .note { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .alert { padding: 12px 14px; border-radius: 14px; font-size: 14px; margin-top: 14px; }
  .alert.amber { background: var(--amber-wash); color: var(--amber); }
  .alert.danger { background: var(--danger-wash); color: var(--danger); }
  .ask { display: none; margin-top: 10px; }
  .ask.on { display: block; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .chips button { border: 0; padding: 8px 12px; border-radius: 100px; background: var(--raised2); color: var(--body); font-size: 13px; font-weight: 600; box-shadow: inset 0 0 0 1px var(--hair); }

  /* ---------- desk tab ---------- */
  .panel { background: var(--raised); border-radius: 18px; box-shadow: inset 0 0 0 1px var(--hair); padding: 16px; margin-top: 14px; }
  .runbtns { display: grid; gap: 10px; }
  .runrow { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-top: 1px solid var(--hair); }
  .runrow:first-child { border-top: 0; }
  .runrow div { flex: 1; min-width: 0; }
  .runrow b { display: block; font-size: 15px; }
  .runrow span { font-size: 13px; color: var(--muted); }
  .pill { padding: 4px 10px; border-radius: 100px; font-size: 12px; font-weight: 800; }
  .pill.ok { background: var(--mint-wash); color: var(--mint); } .pill.run { background: var(--amber-wash); color: var(--amber); } .pill.bad { background: var(--danger-wash); color: var(--danger); }
  .mdr { color: var(--body); font-size: 14px; line-height: 1.6; overflow-x: auto; }
  .mdr h3 { font-size: 16px; color: #fff; margin: 4px 0 8px; } .mdr h4 { font-size: 14px; color: #fff; margin: 14px 0 6px; }
  .mdr p { margin: 6px 0; } .mdr ul { margin: 6px 0; padding-left: 18px; } .mdr strong { color: #fff; }
  .mdr table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 8px 0; } .mdr td, .mdr th { text-align: left; padding: 6px 8px 6px 0; border-top: 1px solid var(--hair); vertical-align: top; }
  .mdr th { color: var(--faint); font-weight: 700; border-top: 0; } .mdr code { background: var(--raised2); padding: 1px 5px; border-radius: 5px; font-size: 12px; }
  .md { white-space: pre-wrap; color: var(--body); font-size: 14px; line-height: 1.6; max-height: 420px; overflow: auto; }

  #toast { position: fixed; left: 16px; right: 16px; bottom: calc(92px + var(--safe-b)); z-index: 30; margin: 0 auto; max-width: 420px; background: #fff; color: var(--night);
           font-weight: 700; padding: 14px 16px; border-radius: 14px; box-shadow: 0 20px 40px rgba(0,0,0,.5); transform: translateY(30px); opacity: 0; transition: .25s; pointer-events: none; }
  #toast.on { transform: none; opacity: 1; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <symbol id="i-reel" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M3 8h18M8 3l3 5M14 3l3 5"/><path d="M10 12.5v4l3.5-2z" fill="currentColor"/></symbol>
  <symbol id="i-story" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9" stroke-dasharray="3.2 2.4"/><circle cx="12" cy="12" r="4.5"/></symbol>
  <symbol id="i-post" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M3 15l5-5 4 4 3-3 6 6"/><circle cx="15.5" cy="8.5" r="1.5"/></symbol>
  <symbol id="i-desk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></symbol>
</svg>

<section id="login">
  <form class="lock" id="loginForm" autocomplete="off">
    <img src="logo.png" alt="">
    <h1 id="brandName">Content Desk</h1>
    <p>Your posts, reels and stories in one place.</p>
    <input class="input" id="pw" type="password" placeholder="Password" autocomplete="current-password" required>
    <label class="check"><input type="checkbox" id="remember" checked> Keep me signed in on this phone</label>
    <button class="btn primary block" id="unlock">Unlock</button>
    <div class="err" id="loginErr"></div>
  </form>
</section>

<section id="app" hidden>
  <div class="top">
    <div class="topbar">
      <h1 id="title">Reels</h1>
      <button class="round" id="refresh" aria-label="Refresh"><svg class="icon"><use href="#i-refresh"/></svg></button>
    </div>
    <div class="seg" id="seg"></div>
  </div>
  <main id="main"></main>
  <nav class="tabbar"><div>
    <button data-tab="reels" class="on"><svg class="icon"><use href="#i-reel"/></svg>Reels</button>
    <button data-tab="stories"><svg class="icon"><use href="#i-story"/></svg>Stories</button>
    <button data-tab="posts"><svg class="icon"><use href="#i-post"/></svg>Posts</button>
    <button data-tab="desk"><svg class="icon"><use href="#i-desk"/></svg>Desk<span class="dot" id="deskDot" hidden></span></button>
  </div></nav>
</section>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
<div id="toast"></div>

<script type="module">
import { VAULT } from "./vault.js";
import { CONFIG } from "./config.js";

const REPO = CONFIG.repo, BRANCH = CONFIG.branch, KEY = "content-desk-token";
let token = null, posts = [], files = new Set(), deskFiles = {};
const state = { tab: "reels", view: "upcoming" };
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
document.title = `${CONFIG.name} Desk`; $("#brandName").textContent = document.title;
const toast = (m) => { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 3000); };

/* ---------------- unlock ---------------- */
const b64d = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function decrypt(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64d(VAULT.salt), iterations: VAULT.iterations, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64d(VAULT.iv) }, key, b64d(VAULT.ct)));
}
// A saved key is tied to the vault it came from: when the vault is re-locked
// (new token or password), keys saved from the old one are ignored.
const VAULT_ID = VAULT.ct.slice(0, 24);
const store = {
  get: () => { try { const raw = localStorage.getItem(KEY) || sessionStorage.getItem(KEY); const v = raw && JSON.parse(raw); return v?.vault === VAULT_ID ? v.token : null; } catch { return null; } },
  set: (v, keep) => { try { (keep ? localStorage : sessionStorage).setItem(KEY, JSON.stringify({ vault: VAULT_ID, token: v })); } catch {} },
  clear: () => { try { localStorage.removeItem(KEY); sessionStorage.removeItem(KEY); } catch {} },
};
$("#loginForm").addEventListener("submit", async (e) => {
  e.preventDefault(); $("#unlock").disabled = true; $("#unlock").textContent = "Unlocking…"; $("#loginErr").textContent = "";
  try { token = await decrypt($("#pw").value); store.set(token, $("#remember").checked); $("#pw").value = ""; await start(); }
  catch { token = null; $("#loginErr").textContent = "That password didn't unlock the desk."; }
  $("#unlock").disabled = false; $("#unlock").textContent = "Unlock";
});

/* ---------------- GitHub ---------------- */
async function gh(path, opts = {}) {
  const res = await fetch(`https://api.github.com/repos/${REPO}${path}`, { ...opts, headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json", ...(opts.headers || {}) } });
  if (res.status === 401 || (res.status === 404 && /\/git\/trees\//.test(path))) {
    store.clear(); setTimeout(() => location.reload(), 1500);
    throw new Error("This saved sign-in no longer works. Unlock again.");
  }
  if (!res.ok && res.status !== 204) throw new Error(`GitHub ${res.status}: ${(await res.text()).slice(0, 140)}`);
  return res.status === 204 ? null : opts.raw ? res.blob() : res.json();
}
const decode = (b64) => new TextDecoder().decode(b64d(b64.replace(/\n/g, "")));
const encode = (t) => { const u = new TextEncoder().encode(t); let s = ""; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode(...u.subarray(i, i + 0x8000)); return btoa(s); };
const readFile = async (p) => { const f = await gh(`/contents/${p}?ref=${BRANCH}`); return { text: decode(f.content), sha: f.sha }; };
async function writeFile(p, text, message, sha) {
  for (let i = 0; i < 3; i++) {
    try { return await gh(`/contents/${p}`, { method: "PUT", body: JSON.stringify({ message, content: encode(text), sha, branch: BRANCH }) }); }
    catch (e) { if (!/GitHub (409|422)/.test(e.message) || i === 2) throw e; sha = (await readFile(p)).sha; }
  }
}
const dispatch = (wf, inputs) => gh(`/actions/workflows/${wf}/dispatches`, { method: "POST", body: JSON.stringify({ ref: BRANCH, ...(inputs ? { inputs } : {}) }) });
const blobs = new Map();
const mediaUrl = (p) => { if (!blobs.has(p)) blobs.set(p, gh(`/contents/${p}?ref=${BRANCH}`, { raw: true, headers: { Accept: "application/vnd.github.raw" } }).then((b) => URL.createObjectURL(b))); return blobs.get(p); };

/* ---------------- data ---------------- */
async function load() {
  const tree = (await gh(`/git/trees/${BRANCH}?recursive=1`)).tree;
  files = new Set(tree.map((t) => t.path));
  const names = [...new Set(tree.filter((t) => /^content\/[^/]+\/post(\.held)?\.json$/.test(t.path)).map((t) => t.path.split("/")[1]))];
  const readJson = async (p) => (files.has(p) ? JSON.parse((await readFile(p)).text) : null);
  posts = await Promise.all(names.map(async (name) => {
    const base = `content/${name}`, specPath = files.has(`${base}/post.json`) ? `${base}/post.json` : `${base}/post.held.json`;
    const [spec, published, failed] = await Promise.all([readJson(specPath), readJson(`${base}/published.json`), readJson(`${base}/failed.json`)]);
    return { name, base, specPath, spec, published, failed, legacyHeld: specPath.endsWith(".held.json") };
  }));
  const [fb, iss, rep] = await Promise.allSettled(["FEEDBACK.md", "ISSUES.md", "results/desk-report.md"].map(readFile));
  deskFiles = { feedback: fb.value?.text ?? "", issues: iss.value?.text ?? "", report: rep.value?.text ?? "" };
}
const isVideo = (p) => /\.(mp4|mov)$/i.test(p.spec.media?.[0] ?? "");
const type = (p) => p.spec.format === "story" ? "stories" : isVideo(p) ? "reels" : "posts";
const kindLabel = (p) => !p.spec.media?.length ? "FB text" : p.spec.format === "story" ? "Story" : isVideo(p) ? "Reel" : p.spec.media.length > 1 ? `${p.spec.media.length} slides` : "Image";
const held = (p) => !!(p.spec.hold || p.legacyHeld);
function status(p) {
  if (p.published) return ["done", "Live"];
  if (p.spec.cancelled) return ["off", "Dropped"];
  if (p.failed?.skipped) return ["off", "Missed"];
  if (p.failed?.gave_up) return ["fail", "Failed"];
  if (held(p)) return ["held", pendingRequest(p) ? "Being redone" : "Held"];
  if (p.failed) return ["fail", "Retrying"];
  return ["sched", "Scheduled"];
}
const pendingRequest = (p) => { const open = (deskFiles.feedback.split("## Done")[0] || ""); return open.includes(`[content/${p.name}]`); };
const when = (p) => p.published?.at ?? p.spec.publish_at;
const ist = (iso, o) => new Date(iso).toLocaleString(CONFIG.locale, { timeZone: CONFIG.timezone, ...o });
const dayLabel = (iso) => {
  const d = ist(iso, { year: "numeric", month: "2-digit", day: "2-digit" }), today = ist(new Date().toISOString(), { year: "numeric", month: "2-digit", day: "2-digit" });
  const tmr = ist(new Date(Date.now() + 864e5).toISOString(), { year: "numeric", month: "2-digit", day: "2-digit" });
  return d === today ? "Today" : d === tmr ? "Tomorrow" : ist(iso, { weekday: "long", day: "numeric", month: "short" });
};
const shortDay = (iso) => { const d = dayLabel(iso); return /^(Today|Tomorrow)$/.test(d) ? d : ist(iso, { weekday: "short", day: "numeric", month: "short" }); };
const timeLabel = (iso) => ist(iso, { hour: "numeric", minute: "2-digit" });
const [, sign, oh, om] = CONFIG.utc_offset.match(/([+-])(\d\d):(\d\d)/);
const OFFSET_MS = (sign === "-" ? -1 : 1) * (oh * 60 + +om) * 60e3;
const toLocalInput = (iso) => new Date(Date.parse(iso) + OFFSET_MS).toISOString().slice(0, 16);

const thumbPath = (p) => { if (!p.spec.media?.length) return null; if (!isVideo(p)) return `${p.base}/${p.spec.media[0]}`; return files.has(`${p.base}/cover.jpg`) ? `${p.base}/cover.jpg` : null; };
function lazyThumbs() {
  const io = new IntersectionObserver((entries) => entries.forEach(async (e) => {
    if (!e.isIntersecting) return; io.unobserve(e.target);
    const p = posts.find((x) => x.name === e.target.dataset.thumb), path = p && thumbPath(p);
    if (path) { try { e.target.style.backgroundImage = `url(${await mediaUrl(path)})`; } catch {} }
  }), { rootMargin: "300px" });

}

/* ---------------- tiny markdown (headings, bold, code, lists, tables) ---------------- */
function md(src) {
  const inline = (t) => esc(t).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`([^`]+)`/g, "<code>$1</code>");
  const out = []; let list = false, table = null;
  const flush = () => { if (list) { out.push("</ul>"); list = false; } if (table) { out.push("<table>" + table.join("") + "</table>"); table = null; } };
  // Re-join hard-wrapped lines: a plain line continues the paragraph or list item above it.
  const lines = [];
  for (const l of src.split("\n")) {
    const prev = lines[lines.length - 1];
    if (l.trim() && prev?.trim() && !/^\s*([-*] |\||#)/.test(l) && !/^\s*\|/.test(prev)) lines[lines.length - 1] = `${prev} ${l.trim()}`;
    else lines.push(l);
  }
  for (const line of lines) {
    if (/^\s*\|/.test(line)) {
      if (/^\s*\|[\s|:-]+\|\s*$/.test(line)) continue;
      const cells = line.trim().replace(/^\||\|$/g, "").split("|").map((c) => inline(c.trim()));
      if (!table) { flush(); table = [`<tr>${cells.map((c) => `<th>${c}</th>`).join("")}</tr>`]; } else table.push(`<tr>${cells.map((c) => `<td>${c}</td>`).join("")}</tr>`);
      continue;
    }
    if (table) flush();
    if (/^## /.test(line)) { flush(); out.push(`<h3>${inline(line.slice(3))}</h3>`); }
    else if (/^#{3,} /.test(line)) { flush(); out.push(`<h4>${inline(line.replace(/^#+ /, ""))}</h4>`); }
    else if (/^\s*[-*] /.test(line)) { if (!list) { out.push("<ul>"); list = true; } out.push(`<li>${inline(line.replace(/^\s*[-*] /, ""))}</li>`); }
    else if (line.trim()) { if (list) { out.push("</ul>"); list = false; } out.push(`<p>${inline(line)}</p>`); }
  }
  flush(); return out.join("");
}

/* ---------------- actions ---------------- */
async function busy(btn, fn) { const t = btn.innerHTML; btn.disabled = true; btn.textContent = "Working…"; try { await fn(); } catch (e) { toast(e.message); } btn.disabled = false; btn.innerHTML = t; }
async function updateSpec(p, mutate, msg) {
  const f = await readFile(p.specPath), spec = JSON.parse(f.text); mutate(spec);
  await writeFile(p.specPath, JSON.stringify(spec, null, 2) + "\n", `desk app: ${msg} (${p.name})`, f.sha);
}
async function addFeedback(line) {
  const f = await readFile("FEEDBACK.md");
  const stamp = ist(new Date().toISOString(), { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });
  const entry = `- ${stamp} · ${line.replace(/\s*\n+\s*/g, " ")}\n`;
  const next = /## Open\n/.test(f.text) ? f.text.replace(/## Open\n\n?/, `## Open\n\n${entry}`) : `${f.text.trimEnd()}\n\n## Open\n\n${entry}`;
  await writeFile("FEEDBACK.md", next, "desk app: feedback", f.sha);
}
async function act(p, a, s) {
  const text = (id) => ($(`#ask-${id} textarea`, s)?.value || "").trim();
  const now = (id) => $(`#ask-${id} .now`, s)?.checked;
  if (a === "save") {
    const cap = $("#cap", s).value; let t = $("#time", s).value;
    if (t) { const [d, hm] = t.split("T"); let [h, m] = hm.split(":").map(Number); m = m < 15 ? 0 : m < 45 ? 30 : 60; if (m === 60) { h += 1; m = 0; }
      if (h > 23) throw new Error("Pick a time before 11:30 pm."); t = `${d}T${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`; }
    await updateSpec(p, (x) => { x.caption = cap; if (t) x.publish_at = `${t}:00${CONFIG.utc_offset}`; }, "edit");
    toast("Saved.");
  } else if (a === "hold") {
    if (p.legacyHeld) throw new Error("This one was held by the desk. Use Request a change instead.");
    await updateSpec(p, (x) => { x.hold ? delete x.hold : (x.hold = true); }, held(p) ? "release" : "hold");
    toast(held(p) ? "Released. It goes out on time." : "Held. It won't go out until you release it.");
  } else if (a === "now") {
    if (!confirm("Post this to Instagram and Facebook now?")) return;
    await updateSpec(p, (x) => { x.publish_at = new Date(Date.now() - 60e3).toISOString(); delete x.hold; }, "post now");
    await dispatch("queue.yml"); toast("Posting now. It'll show as Live in a few minutes.");
  } else if (a === "drop") {
    if (!confirm("Drop this? It won't go out. You can bring it back from Dropped.")) return;
    await updateSpec(p, (x) => { x.cancelled = true; }, "drop"); toast("Dropped.");
  } else if (a === "restore") {
    await updateSpec(p, (x) => { delete x.cancelled; }, "restore"); toast("Back in the queue.");
  } else if (a === "change") {
    const t = text("change"); if (!t) throw new Error("Write what should change.");
    if (!p.legacyHeld) await updateSpec(p, (x) => { x.hold = true; }, "hold for change");
    await addFeedback(`[content/${p.name}] CHANGE: ${t}`);
    if (now("change")) await dispatch("desk.yml", { job: "daily" });
    toast(now("change") ? "Sent. The desk is fixing it now." : "Sent. Held until the next run fixes it.");
  } else if (a === "remake") {
    const t = text("remake") || "Not right. Make a different piece for this slot.";
    if (!p.legacyHeld) await updateSpec(p, (x) => { x.hold = true; }, "hold for remake");
    await addFeedback(`[content/${p.name}] REMAKE: ${t}`);
    if (now("remake")) await dispatch("desk.yml", { job: "daily" });
    toast("Got it. A new piece will replace this one.");
  } else if (a === "disliked") {
    const t = text("disliked"); if (!t) throw new Error("Say what didn't work.");
    await addFeedback(`[content/${p.name}] DISLIKED: ${t}`); toast("Noted. The desk will learn from it.");
  }
  history.back(); await refresh(false);
}
async function sendReference() {
  const url = $("#refUrl").value.trim(), file = $("#refFile").files[0], note = $("#refNote").value.trim();
  if (!url && !file) throw new Error("Add a link or a file.");
  let stored = "";
  if (file) {
    if (file.size > 40 * 1048576) throw new Error("That file is over 40 MB. Trim it or send a link instead.");
    const day = new Date().toISOString().slice(0, 10), safe = file.name.toLowerCase().replace(/[^a-z0-9.]+/g, "-").replace(/^-+|-+$/g, "");
    stored = `inbox/${day}-${Date.now().toString(36)}-${safe}`;
    const bytes = new Uint8Array(await file.arrayBuffer()); let bin = "";
    for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
    await gh(`/contents/${stored}`, { method: "PUT", body: JSON.stringify({ message: "desk app: reference file", content: btoa(bin), branch: BRANCH }) });
  }
  await addFeedback(`REF: ${[url, stored].filter(Boolean).join(" + ")}${note ? ` - ${note}` : ""}`);
  $("#refUrl").value = ""; $("#refNote").value = ""; $("#refFile").value = ""; $("#refFileName").textContent = "Add a file (audio, image or video)";
  toast("Got it. The desk studies it on its next run."); await refresh(false);
}
async function sendFeedback(t, run) {
  t = t.trim(); if (!t) return toast("Write something first.");
  try { await addFeedback(t); if (run) await dispatch("desk.yml", { job: "daily" }); toast(run ? "Sent. The desk is acting on it now." : "Sent. The next run acts on it first."); await refresh(false); }
  catch (e) { toast(e.message); }
}

/* ---------------- wiring ---------------- */
document.querySelectorAll(".tabbar button").forEach((b) => b.onclick = () => { state.tab = b.dataset.tab; state.view = "upcoming"; render(); scrollTo({ top: 0 }); });
$("#seg").onclick = (e) => { const v = e.target.closest("[data-view]")?.dataset.view; if (v) { state.view = v; render(); } };
$("#main").onclick = (e) => { const n = e.target.closest("[data-open]")?.dataset.open; if (n) openSheet(posts.find((p) => p.name === n)); };
async function refresh(say = true) {
  const r = $("#refresh"); r.classList.add("spin");
  try { await load(); render(); if (say) toast("Up to date."); } catch (e) { toast(e.message); }
  r.classList.remove("spin");
}
$("#refresh").onclick = () => refresh();
document.addEventListener("visibilitychange", () => { if (!document.hidden && token) refresh(false); });
async function start() { $("#login").hidden = true; $("#app").hidden = false; await refresh(false); }
token = store.get(); if (token) start();
</script>
