<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../brand/brand.css">
<style>
  html, body { width: 1080px; height: 1920px; }
  body { position: relative; overflow: hidden; background: var(--b-night); color: var(--b-white);
         padding: 260px 96px 220px; display: flex; flex-direction: column; gap: 40px; }
  body::before { content: ""; position: absolute; inset: 0; background: radial-gradient(rgba(255,255,255,.07) 1px, transparent 1px) 0 0 / 32px 32px; }
  body::after { content: ""; position: absolute; width: 900px; height: 900px; right: -300px; top: 380px; border-radius: 50%;
                background: radial-gradient(circle, rgba(34,197,94,.16), transparent 65%); }
  body > * { position: relative; z-index: 1; }
  .logo { width: 120px; height: 120px; }
  .kicker { font-size: 28px; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; color: var(--b-accent-on-dark); }
  h1 { font-size: 168px; line-height: .94; letter-spacing: -7px; font-weight: 900; margin: 0; }
  h1 span { color: var(--b-white-muted); }
  p { font-size: 48px; line-height: 1.35; color: var(--b-white-body); margin: 0; font-weight: 500; }
  .up { margin-top: auto; align-self: center; text-align: center; font-size: 36px; font-weight: 700; }
  .up svg { display: block; margin: 0 auto 18px; }
</style>
</head>
<body>
  <img class="logo" src="../../brand/logo/logo-transparent.png" alt="">
  <div class="kicker">New from AI Methods</div>
  <h1>Free.<br>Open<br>source.<br><span>Yours.</span></h1>
  <p>An AI social media team<br>in a GitHub repo.</p>
  <div class="up">
    <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    Link in bio
  </div>
</body>
</html>
