<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../brand/brand.css">
<style>
  html, body { width: 1080px; height: 1350px; }
  body { background: var(--b-paper); color: var(--b-ink); padding: 110px 96px 90px; display: flex; flex-direction: column; gap: 34px; }
  .line { font-size: 72px; font-weight: 800; letter-spacing: -1.5px; line-height: 1.1; }
  .line span { color: rgba(10,10,10,.4); }
  .term { margin-top: 18px; border-radius: 30px; background: #0A0A0A; color: #fff; padding: 0 0 46px;
          font: 600 36px/1.65 ui-monospace, "SF Mono", Consolas, monospace; box-shadow: 0 40px 80px rgba(0,0,0,.14); overflow: hidden; }
  .bar { display: flex; gap: 12px; padding: 26px 32px; background: #161616; margin-bottom: 30px; }
  .bar i { width: 18px; height: 18px; border-radius: 50%; background: #333; }
  .term > div:not(.bar) { padding: 0 44px; }
  .m { color: rgba(255,255,255,.5); }
  .ok { color: var(--b-accent-on-dark); }
  .tag { font: 600 22px/1 var(--b-font); letter-spacing: .14em; text-transform: uppercase; color: var(--b-ink-muted); text-align: right; }
  .foot { margin-top: auto; display: flex; align-items: center; gap: 18px; font-size: 28px; font-weight: 700; }
  .foot img { width: 64px; height: 64px; border-radius: 50%; }
</style>
</head>
<body>
  <div style="margin-top:auto"></div>
  <div class="line"><span>Nobody:</span></div>
  <div class="line">Our desk, Sunday, 10 am:</div>
  <div class="term">
    <div class="bar"><i></i><i></i><i></i></div>
    <div><span class="m">$</span> desk weekly</div>
    <div class="m">planning next 7 days…</div>
    <div><span class="ok">✓</span> reels</div>
    <div><span class="ok">✓</span> posts</div>
    <div><span class="ok">✓</span> stories</div>
    <div><span class="ok">✓</span> every one checked</div>
    <div class="m">done. go enjoy your Sunday.</div>
  </div>
  <div class="tag">Illustrative</div>
  <div class="foot"><img src="../../brand/logo/logo.png" alt="">AI Methods</div>
</body>
</html>
