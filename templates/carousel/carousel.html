<!doctype html>
<!-- Starter carousel. Copy this file into content/<date-slug>/, edit the
     slides, then:  npm run shot -- content/<date-slug>/carousel.html
     Each data-slide becomes one 1080x1350 PNG (Instagram portrait). -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../brand/brand.css">
<style>
  [data-slide] {
    width: 1080px; height: 1350px; padding: 120px 96px;
    display: flex; flex-direction: column; justify-content: center; gap: 40px;
    background: var(--b-night); color: var(--b-white);
  }
  [data-slide].light { background: var(--b-paper); color: var(--b-ink); }
  .kicker { font-size: 30px; font-weight: 800; color: var(--b-accent-on-dark); letter-spacing: .22em; text-transform: uppercase; }
  .light .kicker { color: var(--b-accent); }
  h1 { font-size: 96px; line-height: 1.02; font-weight: 900; letter-spacing: -3px; margin: 0; }
  p  { font-size: 44px; line-height: 1.4; margin: 0; color: var(--b-white-body); }
  .light p { color: var(--b-ink-body); }
  .foot { margin-top: auto; display: flex; align-items: center; gap: 20px; font-size: 30px; font-weight: 700; }
  /* The logo is used exactly as supplied. */
  .foot img { width: 72px; height: 72px; border-radius: 50%; }
</style>
</head>
<body>
  <section data-slide>
    <div class="kicker">Topic</div>
    <h1>The hook goes here, under ten words</h1>
    <div class="foot"><img src="../../brand/logo/logo.png" alt="">Your Brand</div>
  </section>

  <section data-slide class="light">
    <div class="kicker">01</div>
    <h1>One point per slide</h1>
    <p>One or two short lines that back it up. Claims only from the brand skill.</p>
    <div class="foot"><img src="../../brand/logo/logo.png" alt="">Your Brand</div>
  </section>

  <section data-slide>
    <div class="kicker">Next step</div>
    <h1>The one thing you want them to do</h1>
    <p>Link in bio.</p>
    <div class="foot"><img src="../../brand/logo/logo.png" alt="">Your Brand</div>
  </section>
</body>
</html>
