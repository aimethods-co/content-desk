# Publishes due posts (compliance PASS only) and commits published.json + QUEUE.md.
name: queue

# Runs on the hour and half hour. A run with nothing due exits in seconds.
# GitHub can delay cron runs; for exact timing, call workflow_dispatch from an
# external scheduler instead (see README).
on:
  schedule:
    - cron: "0,30 * * * *"
  workflow_dispatch:

concurrency:
  group: content-repo
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    # Scheduled runs stay off until the repo variable DESK_ENABLED is "true".
    if: vars.DESK_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Publish what is due
        env:
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
        run: |
          mkdir -p results
          node scripts/run-queue.mjs
      - name: Commit results
        run: |
          git config user.name "content-desk-bot"
          git config user.email "content-desk-bot@users.noreply.github.com"
          git add -A content QUEUE.md ISSUES.md
          git diff --cached --quiet && exit 0
          git commit -m "queue: published due posts"
          git pull --rebase -X theirs
          git push
