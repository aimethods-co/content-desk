# The content desk: Claude plans and makes posts on a schedule.
#   weekly: Sunday - plan, make and queue next week
#   daily:  evening - comments, feedback, a same-day post only when needed
# Runs on the Claude subscription (CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`).
name: desk

# Cron times are UTC (these are 19:00 and Sunday 10:00 in India). Change them
# for your timezone. If you change the weekly one, change it in "Pick the job"
# too. GitHub can delay or skip cron runs; for exact timing, call
# workflow_dispatch from an external scheduler instead (see README).
on:
  schedule:
    - cron: "30 13 * * *"
    - cron: "30 4 * * 0"
  workflow_dispatch:
    inputs:
      job:
        description: weekly or daily
        default: daily
        type: choice
        options: [daily, weekly]

concurrency:
  group: content-repo
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  desk:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools (Playwright uses the runner's Chrome; FFmpeg from ffmpeg-static)
        run: |
          npm ci
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng >/dev/null
          pip install numpy==1.26.4 "kokoro==0.9.4" "soundfile==0.13.1" "yt-dlp==2026.8.19" --extra-index-url https://download.pytorch.org/whl/cpu
          echo "$PWD/node_modules/ffmpeg-static" >> "$GITHUB_PATH"
          git config user.name "content-desk-bot"
          git config user.email "content-desk-bot@users.noreply.github.com"
      - name: Pick the job
        id: job
        run: |
          JOB="${{ inputs.job }}"
          if [ -z "$JOB" ]; then
            if [ "${{ github.event.schedule }}" = "30 4 * * 0" ]; then JOB=weekly; else JOB=daily; fi
          fi
          echo "name=$JOB" >> "$GITHUB_OUTPUT"
          {
            echo "prompt<<PROMPT_EOF"
            cat "scripts/desk/$JOB.md"
            echo "PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Run the desk (${{ steps.job.outputs.name }})
        uses: anthropics/claude-code-action@v1
        env:
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: ${{ steps.job.outputs.prompt }}
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 400
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Skill,Bash(node:*),Bash(npm:*),Bash(npx:*),Bash(python:*),Bash(python3:*),Bash(ffmpeg:*),Bash(git add:*),Bash(git commit:*),Bash(git status:*),Bash(git log:*),Bash(git diff:*),Bash(yt-dlp:*),Bash(mkdir:*),Bash(cp:*),Bash(mv:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(grep:*),Bash(find:*),Bash(date:*),Bash(echo:*)"
      - name: Push
        if: always()
        run: |
          git add -A content QUEUE.md ISSUES.md FEEDBACK.md results .agents 2>/dev/null || true
          git diff --cached --quiet || git commit -m "desk: ${{ steps.job.outputs.name }} run"
          # QUEUE.md is regenerated by every run; on a clash keep this run's copy.
          git pull --rebase -X theirs
          git push
